---
# Manage iptables firewall rules on the raspberrypi (Debian).
#
# The raspberrypi runs an OpenVPN server (port 1194/udp) and several
# Docker services. This playbook configures the INPUT chain to allow
# access from the local network and VPN subnets.
#
# Docker manages its own chains (DOCKER, FORWARD, NAT) — this playbook
# only manages the INPUT chain rules.
#
# Usage:
#   ansible-playbook raspberrypi-firewall.yml --vault-password-file ~/.ansible-vault.txt

- name: Configure iptables firewall on raspberrypi
  hosts: raspberrypi
  become: true
  vars:
    # Services accessible from the local network
    lan_services:
      - { port: 22, proto: tcp, comment: "SSH" }
      - { port: 3000, proto: tcp, comment: "Homepage" }
      - { port: 6600, proto: tcp, comment: "MPD" }
      - { port: 6881, proto: tcp, comment: "qBittorrent" }
      - { port: 6881, proto: udp, comment: "qBittorrent UDP" }
      - { port: 8080, proto: tcp, comment: "Speedtest" }
      - { port: 8096, proto: tcp, comment: "Jellyfin" }
      - { port: 8123, proto: tcp, comment: "Home Assistant" }
      - { port: 8443, proto: tcp, comment: "Speedtest HTTPS" }
      - { port: 9000, proto: tcp, comment: "Portainer" }
      - { port: 9865, proto: tcp, comment: "qBittorrent web" }

  tasks:
    - name: Ensure iptables-persistent is installed
      ansible.builtin.apt:
        name: iptables-persistent
        state: present

    - name: Allow loopback traffic
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: lo
        jump: ACCEPT

    - name: Allow established and related connections
      ansible.builtin.iptables:
        chain: INPUT
        ctstate:
          - ESTABLISHED
          - RELATED
        jump: ACCEPT

    - name: Allow LAN access to services
      ansible.builtin.iptables:
        chain: INPUT
        source: "{{ local_network }}"
        protocol: "{{ item.proto }}"
        destination_port: "{{ item.port }}"
        jump: ACCEPT
        comment: "{{ item.comment }}"
      loop: "{{ lan_services }}"
      loop_control:
        label: "{{ item.comment }} ({{ item.port }}/{{ item.proto }})"

    - name: Allow OpenVPN server (any source)
      ansible.builtin.iptables:
        chain: INPUT
        protocol: udp
        destination_port: 1194
        jump: ACCEPT
        comment: "OpenVPN server"

    - name: Allow all traffic from VPN clients
      ansible.builtin.iptables:
        chain: INPUT
        source: "{{ item }}"
        jump: ACCEPT
        comment: "VPN clients {{ item }}"
      loop: "{{ vpn_networks }}"

    - name: Allow ICMP ping from local network
      ansible.builtin.iptables:
        chain: INPUT
        source: "{{ local_network }}"
        protocol: icmp
        icmp_type: 8
        jump: ACCEPT
        comment: "LAN ping"

    - name: Allow ICMP ping from VPN networks
      ansible.builtin.iptables:
        chain: INPUT
        source: "{{ item }}"
        protocol: icmp
        icmp_type: 8
        jump: ACCEPT
        comment: "VPN ping {{ item }}"
      loop: "{{ vpn_networks }}"

    - name: Allow Docker bridge traffic
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: "{{ item }}"
        jump: ACCEPT
      loop:
        - docker0
        - br-+

    - name: Log dropped packets
      ansible.builtin.iptables:
        chain: INPUT
        limit: 5/min
        jump: LOG
        log_prefix: "iptables-dropped: "

    - name: Drop all other input traffic
      ansible.builtin.iptables:
        chain: INPUT
        jump: DROP

    - name: Set INPUT chain default policy to DROP
      ansible.builtin.iptables:
        chain: INPUT
        policy: DROP

    - name: Ensure OpenVPN client NAT to LAN
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        source: "10.59.147.0/24"
        out_interface: eth0
        jump: MASQUERADE
        comment: "OpenVPN clients to LAN"

    - name: Save iptables rules
      ansible.builtin.command: netfilter-persistent save
      changed_when: true
